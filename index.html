<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Evita el zoom nativo al hacer doble toque o pellizcar -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>¡Felices 28 mi vida! - Fotolibro</title>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; 
        }

        body, html {
            width: 100vw;
            /* 100dvh es vital: se adapta dinámicamente si aparece la barra de navegación del celular */
            height: 100dvh; 
            overflow: hidden; 
            background-color: #fbf8f1;
            font-family: sans-serif;
            touch-action: manipulation; /* Refuerzo para evitar zoom nativo */
        }

        .viewer-container {
            position: relative;
            width: 100vw;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            /* Efecto Fade + Scale suave y sin desbordes */
            opacity: 0;
            transform: scale(0.95);
            visibility: hidden;
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
            z-index: 1;
        }

        .page.active {
            opacity: 1;
            transform: scale(1);
            visibility: visible;
            z-index: 10;
        }

        /* La clave para mantener proporciones perfectas */
        .page img {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; 
            pointer-events: none; /* Las imágenes no interfieren con el toque */
        }

        .touch-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            z-index: 50; /* Por encima de las imágenes */
            cursor: pointer;
        }

        .touch-left {
            left: 0;
        }

        .touch-right {
            right: 0;
        }

        /* Indicador de ayuda inicial */
        .hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 100;
            pointer-events: none;
            transition: opacity 0.5s;
            letter-spacing: 0.5px;
            text-align: center;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="viewer-container" id="viewerContainer">
        <!-- Imágenes del fotolibro -->
        <div class="page active"><img src="1.jpg" alt="Página 1" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=Portada+(1.jpg)'"></div>
        <div class="page"><img src="2.jpg" alt="Página 2" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=Epílogo+(2.jpg)'"></div>
        <div class="page"><img src="3.jpg" alt="Página 3" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=3.jpg'"></div>
        <div class="page"><img src="4.jpg" alt="Página 4" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=4.jpg'"></div>
        <div class="page"><img src="5.jpg" alt="Página 5" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=5.jpg'"></div>
        <div class="page"><img src="6.jpg" alt="Página 6" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=Resiliente+(6.jpg)'"></div>
        <div class="page"><img src="7.jpg" alt="Página 7" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=Cariñosa+(7.jpg)'"></div>
        <div class="page"><img src="8.jpg" alt="Página 8" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=Apañadora+(8.jpg)'"></div>
        <div class="page"><img src="9.jpg" alt="Página 9" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=Divertida+(9.jpg)'"></div>
        <div class="page"><img src="10.jpg" alt="Página 10" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=Sencilla+(10.jpg)'"></div>
        <div class="page"><img src="11.jpg" alt="Página 11" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=Capaz+(11.jpg)'"></div>
        <div class="page"><img src="12.jpg" alt="Página 12" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=Hermosa+(12.jpg)'"></div>
        <div class="page"><img src="13.jpg" alt="Página 13" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=Contraportada+(13.jpg)'"></div>

        <!-- Zonas de navegación superpuestas e invisibles -->
        <div class="touch-zone touch-left" id="btnPrev"></div>
        <div class="touch-zone touch-right" id="btnNext"></div>
        
        <div class="hint" id="hintText">Toca los bordes para cambiar de foto</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const pages = document.querySelectorAll('.page');
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');
            const hintText = document.getElementById('hintText');
            
            let currentIndex = 0;
            const totalPages = pages.length;

            function updateCarousel(newIndex) {
                // Ocultar texto de ayuda
                if(hintText) hintText.style.opacity = '0';

                // Remover clase activa de la imagen actual
                pages[currentIndex].classList.remove('active');
                
                // Actualizar índice
                currentIndex = newIndex;
                
                // Agregar clase activa a la nueva imagen
                pages[currentIndex].classList.add('active');
            }

            function fireSubtleConfetti() {
                confetti({
                    particleCount: 25,
                    spread: 60,
                    origin: { y: 0.8 },
                    colors: ['#d8a3b0', '#f4e9e6', '#ffffff'],
                    disableForReducedMotion: true
                });
            }

            function initialCelebration() {
                const duration = 2500;
                const animationEnd = Date.now() + duration;
                const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

                function randomInRange(min, max) {
                    return Math.random() * (max - min) + min;
                }

                const interval = setInterval(function() {
                    const timeLeft = animationEnd - Date.now();
                    if (timeLeft <= 0) {
                        return clearInterval(interval);
                    }
                    const particleCount = 50 * (timeLeft / duration);
                    confetti(Object.assign({}, defaults, { 
                        particleCount, 
                        origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } 
                    }));
                    confetti(Object.assign({}, defaults, { 
                        particleCount, 
                        origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } 
                    }));
                }, 250);
            }

            btnPrev.addEventListener('click', () => {
                if (currentIndex > 0) {
                    updateCarousel(currentIndex - 1);
                }
            });

            btnNext.addEventListener('click', () => {
                if (currentIndex < totalPages - 1) {
                    updateCarousel(currentIndex + 1);
                    fireSubtleConfetti();
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' && currentIndex > 0) {
                    updateCarousel(currentIndex - 1);
                } else if (e.key === 'ArrowRight' && currentIndex < totalPages - 1) {
                    updateCarousel(currentIndex + 1);
                    fireSubtleConfetti();
                }
            });

            // Disparar celebración inicial medio segundo después de abrir
            setTimeout(initialCelebration, 500);
        });
    </script>
</body>
</html>
