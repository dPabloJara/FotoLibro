<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>¡Felices 28 mi vida! - Fotolibro</title>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Evita el destello azul al tocar la pantalla en móviles */
            -webkit-tap-highlight-color: transparent; 
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
            background-color: #fbf8f1; /* Fondo crema para que se funda con las imágenes */
            font-family: sans-serif;
        }

        /* Contenedor principal con perspectiva para el efecto 3D */
        .book-container {
            position: relative;
            width: 100%;
            height: 100%;
            perspective: 1200px; /* Profundidad del efecto 3D */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* STREAMING_CHUNK:Estilos de las páginas individuales -->
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fbf8f1;
            
            /* Transición suave para el Slide y el Flip 3D */
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.8s ease;
            
            /* Estado inicial (páginas a la derecha, esperando entrar) */
            transform: translateX(50%) rotateY(45deg) scale(0.8);
            opacity: 0;
            visibility: hidden;
            z-index: 1;
        }

        /* Página que se está viendo actualmente */
        .page.active {
            transform: translateX(0) rotateY(0) scale(1);
            opacity: 1;
            visibility: visible;
            z-index: 10;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        /* Páginas que ya pasaron (a la izquierda) */
        .page.past {
            transform: translateX(-50%) rotateY(-45deg) scale(0.8);
            opacity: 0;
            visibility: hidden;
            z-index: 1;
        }

        /* STREAMING_CHUNK:Ajuste de imágenes para que NUNCA se corten -->
        .page img {
            width: 100%;
            height: 100%;
            /* contain asegura que la imagen se vea completa siempre */
            object-fit: contain; 
            pointer-events: none; /* Evita que la imagen interfiera con el toque */
        }
        
        /* Indicador de toque sutil al inicio */
        .hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.4);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 100;
            pointer-events: none;
            transition: opacity 0.5s;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="book-container" id="bookContainer">
        <!-- Página 1 a 13 -->
        <div class="page active"><img src="1.jpg" alt="Página 1" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=Portada+(1.jpg)'"></div>
        <div class="page"><img src="2.jpg" alt="Página 2" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=Epílogo+(2.jpg)'"></div>
        <div class="page"><img src="3.jpg" alt="Página 3" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=3.jpg'"></div>
        <div class="page"><img src="4.jpg" alt="Página 4" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=4.jpg'"></div>
        <div class="page"><img src="5.jpg" alt="Página 5" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=5.jpg'"></div>
        <div class="page"><img src="6.jpg" alt="Página 6" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=Resiliente+(6.jpg)'"></div>
        <div class="page"><img src="7.jpg" alt="Página 7" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=Cariñosa+(7.jpg)'"></div>
        <div class="page"><img src="8.jpg" alt="Página 8" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=Apañadora+(8.jpg)'"></div>
        <div class="page"><img src="9.jpg" alt="Página 9" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=Divertida+(9.jpg)'"></div>
        <div class="page"><img src="10.jpg" alt="Página 10" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=Sencilla+(10.jpg)'"></div>
        <div class="page"><img src="11.jpg" alt="Página 11" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=Capaz+(11.jpg)'"></div>
        <div class="page"><img src="12.jpg" alt="Página 12" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=Hermosa+(12.jpg)'"></div>
        <div class="page"><img src="13.jpg" alt="Página 13" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=Contraportada+(13.jpg)'"></div>
    </div>
    
    <div class="hint" id="hintText">Toca los lados para pasar de página</div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const pages = document.querySelectorAll('.page');
            const hintText = document.getElementById('hintText');
            let currentIndex = 0;
            const totalPages = pages.length;

            // Función para actualizar las clases CSS y generar el efecto 3D
            function updatePages() {
                pages.forEach((page, index) => {
                    // Limpiar clases
                    page.classList.remove('active', 'past');
                    
                    if (index === currentIndex) {
                        page.classList.add('active');
                    } else if (index < currentIndex) {
                        page.classList.add('past');
                    }
                    // Si el índice es mayor, se queda sin clases (estado por defecto: a la derecha)
                });
            }

            // Función para disparar confeti sutil al cambiar de página
            function fireSubtleConfetti() {
                confetti({
                    particleCount: 20,
                    spread: 50,
                    origin: { y: 0.8 },
                    colors: ['#d8a3b0', '#f4e9e6', '#ffffff'] // Colores pastel acordes al diseño
                });
            }

            document.body.addEventListener('click', (e) => {
                // Ocultar el texto de ayuda al primer toque
                if(hintText) hintText.style.opacity = '0';

                const screenWidth = window.innerWidth;
                const clickX = e.clientX;

                if (clickX > screenWidth / 2) {
                    // Tocar lado derecho -> Siguiente página
                    if (currentIndex < totalPages - 1) {
                        currentIndex++;
                        updatePages();
                        fireSubtleConfetti();
                    }
                } else {
                    // Tocar lado izquierdo -> Página anterior
                    if (currentIndex > 0) {
                        currentIndex--;
                        updatePages();
                    }
                }
            });

            // Soporte para flechas del teclado (por si lo abre en PC)
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight' && currentIndex < totalPages - 1) {
                    currentIndex++;
                    updatePages();
                    fireSubtleConfetti();
                } else if (e.key === 'ArrowLeft' && currentIndex > 0) {
                    currentIndex--;
                    updatePages();
                }
            });

            function initialCelebration() {
                const duration = 2500;
                const animationEnd = Date.now() + duration;
                const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

                function randomInRange(min, max) {
                    return Math.random() * (max - min) + min;
                }

                const interval = setInterval(function() {
                    const timeLeft = animationEnd - Date.now();
                    if (timeLeft <= 0) {
                        return clearInterval(interval);
                    }
                    const particleCount = 50 * (timeLeft / duration);
                    confetti(Object.assign({}, defaults, { 
                        particleCount, 
                        origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } 
                    }));
                    confetti(Object.assign({}, defaults, { 
                        particleCount, 
                        origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } 
                    }));
                }, 250);
            }

            // Ejecutar la celebración inicial medio segundo después de cargar
            setTimeout(initialCelebration, 500);
            
            // Inicializar las páginas correctamente
            updatePages();
        });
    </script>
</body>
</html>
