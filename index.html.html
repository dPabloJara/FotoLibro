<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>¡Felices 28 mi vida! - Fotolibro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        /* Reseteo y eliminación de bordes/márgenes */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Sin barras de desplazamiento */
            background-color: #fbf8f1; /* Fondo crema claro */
            font-family: sans-serif;
            position: relative;
        }

        /* Contenedor principal de los slides */
        .slide-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* Estilos de las imágenes */
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s ease-in-out, visibility 0.6s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
            z-index: 10;
        }

        /* Comportamiento responsivo de la imagen */
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Por defecto en móviles: cubre toda la pantalla */
        }

        /* Si la pantalla es más ancha que alta (ej. PC o tablet horizontal), evitamos recortar el texto */
        @media (min-aspect-ratio: 4/5) {
            .slide img {
                object-fit: contain; 
            }
        }

        /* Botones de navegación semitransparentes */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.15); /* Muy sutil */
            color: rgba(255, 255, 255, 0.9);
            border: none;
            cursor: pointer;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            transition: background 0.3s, transform 0.3s;
        }

        .nav-btn:hover {
            background: rgba(0, 0, 0, 0.4);
            transform: translateY(-50%) scale(1.1);
        }

        .prev-btn { left: 15px; }
        .next-btn { right: 15px; }

        .nav-btn svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        /* Indicador de página */
        .page-indicator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            color: #555;
            z-index: 20;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="slide-container" id="carousel">
        <!-- Generando las 13 imágenes solicitadas. El onerror previene errores si falta alguna imagen -->
        <div class="slide active"><img src="1.jpg" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=1.jpg'"></div>
        <div class="slide"><img src="2.jpg" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=2.jpg'"></div>
        <div class="slide"><img src="3.jpg" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=3.jpg'"></div>
        <div class="slide"><img src="4.jpg" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=4.jpg'"></div>
        <div class="slide"><img src="5.jpg" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=5.jpg'"></div>
        <div class="slide"><img src="6.jpg" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=6.jpg'"></div>
        <div class="slide"><img src="7.jpg" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=7.jpg'"></div>
        <div class="slide"><img src="8.jpg" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=8.jpg'"></div>
        <div class="slide"><img src="9.jpg" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=9.jpg'"></div>
        <div class="slide"><img src="10.jpg" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=10.jpg'"></div>
        <div class="slide"><img src="11.jpg" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=11.jpg'"></div>
        <div class="slide"><img src="12.jpg" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=12.jpg'"></div>
        <div class="slide"><img src="13.jpg" onerror="this.src='https://placehold.co/800x1200/fbf8f1/d8a3b0?text=13.jpg'"></div>
    </div>

    <!-- Botones de Navegación -->
    <button id="prevBtn" class="nav-btn prev-btn" aria-label="Anterior">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button id="nextBtn" class="nav-btn next-btn" aria-label="Siguiente">
        <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
    </button>

    <div id="pageIndicator" class="page-indicator">1 / 13</div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const slides = document.querySelectorAll('.slide');
            const totalSlides = slides.length;
            let currentIndex = 0;
            const pageIndicator = document.getElementById('pageIndicator');

            // --- EFECTOS DE CONFETI ---

            // Efecto 1: Explosión grande al abrir la página
            function fireBigExplosion() {
                const duration = 3000;
                const animationEnd = Date.now() + duration;
                const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

                function randomInRange(min, max) {
                    return Math.random() * (max - min) + min;
                }

                const interval = setInterval(function() {
                    const timeLeft = animationEnd - Date.now();

                    if (timeLeft <= 0) {
                        return clearInterval(interval);
                    }

                    const particleCount = 50 * (timeLeft / duration);
                    // Serpentinas y confeti desde dos orígenes laterales
                    confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                    confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
                }, 250);
            }

            // Efecto 2: Confeti sutil al cambiar de página
            function fireSubtleConfetti() {
                // Pequeño disparo desde las esquinas inferiores
                confetti({
                    particleCount: 20,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0, y: 1 },
                    colors: ['#ffb6c1', '#ffd700', '#ff69b4']
                });
                confetti({
                    particleCount: 20,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1, y: 1 },
                    colors: ['#ffb6c1', '#ffd700', '#ff69b4']
                });
            }

            // Disparar explosión inicial
            setTimeout(fireBigExplosion, 300); // Pequeño retraso para que cargue la imagen

            // --- LÓGICA DEL CARRUSEL ---

            function updateCarousel(newIndex) {
                slides[currentIndex].classList.remove('active');
                
                currentIndex = newIndex;
                
                if (currentIndex < 0) {
                    currentIndex = totalSlides - 1;
                } else if (currentIndex >= totalSlides) {
                    currentIndex = 0;
                }
                
                slides[currentIndex].classList.add('active');
                pageIndicator.textContent = `${currentIndex + 1} / ${totalSlides}`;
                
                // Disparar efecto sutil al cambiar
                fireSubtleConfetti();
            }

            document.getElementById('prevBtn').addEventListener('click', () => {
                updateCarousel(currentIndex - 1);
            });

            document.getElementById('nextBtn').addEventListener('click', () => {
                updateCarousel(currentIndex + 1);
            });

            // Navegación con teclado
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') updateCarousel(currentIndex - 1);
                if (e.key === 'ArrowRight') updateCarousel(currentIndex + 1);
            });

            // Soporte para gestos táctiles (Swipe)
            let touchStartX = 0;
            let touchEndX = 0;
            const slideContainer = document.getElementById('carousel');

            slideContainer.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
            }, {passive: true});

            slideContainer.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, {passive: true});

            function handleSwipe() {
                const swipeThreshold = 40; 
                if (touchEndX < touchStartX - swipeThreshold) {
                    updateCarousel(currentIndex + 1); // Swipe izquierda
                }
                if (touchEndX > touchStartX + swipeThreshold) {
                    updateCarousel(currentIndex - 1); // Swipe derecha
                }
            }
        });
    </script>
</body>
</html>
